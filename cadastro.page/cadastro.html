<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página Cadastro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #897054;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('imagens/homem_negro.png'); 
            background-size: cover;
            background-position: center;
            opacity: 0.3; 
            z-index: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            min-height: 600px;
            position: relative;
            z-index: 1; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .header a {
            text-decoration: none;
            color: black;
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
        }
        .header a.active {
            font-weight: bold;
        }
        .settings-icon img {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="background-image"></div> 
    
    <div class="container">
        <div class="header">
            <a href="loginpage/login.html" class="tab">Login</a>
            <a href="#" class="tab active">Cadastro</a>
            <span class="settings-icon"><a href="#"><img src="imagens/ferramenta.png" alt="Configurações"></a></span>
        </div>
        
        <div class="form-container">
            <form onsubmit="return irParaLoja(event)">
                <div class="input-group">
                    <span class="icon"><img src="imagens/user.png" alt="Usuário"></span>
                    <input type="text" id="nome" placeholder="Nome" required>
                </div>
                <div class="input-group">
                    <span class="icon"><img src="imagens/mensagem.png" alt="Email"></span>
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <span class="icon"><img src="imagens/icon.png" alt="Senha"></span>
                    <input type="password" id="senha" placeholder="Senha" required>
                </div>
                <div class="input-group">
                    <span class="icon"><img src="imagens/unlock.png" alt="Confirmar Senha"></span>
                    <input type="password" id="confirmarSenha" placeholder="Senha Novamente" required>
                </div>
                
                <button type="submit" class="submit-btn">Cadastrar</button>
            </form>
        </div>
    </div>

    <script>
        function irParaLoja(event) {
            event.preventDefault(); 
            window.location.href = "lojapage/loja.html"; 
        }
    </script>
</body>
</html>
