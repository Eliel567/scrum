<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Página de Cadastro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #897054;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            min-height: 600px;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .header a {
            text-decoration: none;
            color: black;
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
        }
        .header a.active {
            font-weight: bold;
        }
        .settings-icon img {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#" class="tab">Login</a>
            <a href="#" class="tab active">Cadastro</a>
            <span class="settings-icon"><a href="#"><img src="imagens/ferramenta.png" alt="Configurações"></a></span>
        </div>
        
        <div class="form-container">
            <div class="profile-pic">
                <img src="imagens/homem_negro.png" alt="Upload de Imagem">
            </div>
            
            <form action="register.jsp" method="post">
                <div class="input-group">
                    <span class="icon"><img src="imagens/user.png" alt="Usuário"></span>
                    <input type="text" name="nome" placeholder="Nome" required>
                </div>
                <div class="input-group">
                    <span class="icon"><img src="imagens/mensagem.png" alt="Email"></span>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <span class="icon"><img src="imagens/icon.png" alt="Senha"></span>
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>
                <div class="input-group">
                    <span class="icon"><img src="imagens/unlock.png" alt="Confirmar Senha"></span>
                    <input type="password" name="confirmarSenha" placeholder="Senha Novamente" required>
                </div>
                
                <button type="submit" class="submit-btn">Cadastrar</button>
            </form>
        </div>
    </div>
</body>
</html>
