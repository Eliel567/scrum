<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 12px;
        }
        body {
            background: linear-gradient(to bottom, #897054 90%, #231D15 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
        
        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('imagens/eletronicos.png'); 
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: 0;
        }
       
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            width: 350px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: white;
            border-radius: 10px 10px 0 0;
            padding: 10px;
            width: 100%;
        }
        .tabs span {
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            text-align: center;
        }
      
        .icon img {
            width: 80px;
            height: 80px;
            margin: 20px auto;
            display: block;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .forgot-password {
            margin-top: 10px;
            color: #52B0E5;
            cursor: pointer;
        }
       
        .login-button {
            background-color: #007bff;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: none;
            padding: 10px;
            width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="background-image"></div> 
    
    <div class="container">
        <div class="tabs">
            <span>Cadastro</span>
            <span>Login</span>
        </div>
     
        <div class="icon">
            <img src="imagens/logo.jpeg" alt="Logo">
        </div>
        <form onsubmit="return loginUsuario(event)">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Digite seu email" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="login-button">Entrar</button>
        </form>
        <div class="forgot-password">Esqueceu sua senha?</div>
    </div>

    <script>
        function loginUsuario(event) {
            event.preventDefault(); 

            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;

            if (!email || !senha) {
                alert("Por favor, preencha todos os campos!");
                return false;
            }

            alert("Login realizado com sucesso!");
            window.location.href = "lojapage/loja.html"; 
        }
    </script>
</body>
</html>
